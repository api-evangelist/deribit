        href: /api-reference/trading/private-get_mmp_status
  /private/set_mmp_config:
    get:
      tags:
      - Trading
      parameters:
      - name: index_name
        required: true
        in: query
        schema:
          $ref: '#/components/schemas/index_name_derivative'
        description: Index identifier of derivative instrument on the platform
      - name: interval
        required: true
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 3600
          example: 60
        description: 'The duration of the monitoring window in seconds. For example, an `interval` of `3` implies a 3-second window.


          The `interval` begins after the first trade. If a new trade is executed after the `interval` has ended, a new `interval` is started, and counters reset. If a trade occurs during an already running `interval`, that `interval` continues unaffected.


          This mechanism allows the platform to track activity in short, rolling windows to identify potentially risky trading behavior.


          If set to `0`, MMP is removed.


          Maximum value: `3600` seconds (1 hour).

          '
      - name: frozen_time
        required: true
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 3600
          example: 0
        description: 'Time in seconds that MMP remains active after being triggered. Once this frozen period has passed, MMP will automatically reset, allowing new orders to be submitted.


          If you want to disable automatic reset, set `frozen_time` to `0`. In that case, a manual reset is required using the `private/reset_mmp` method.


          Manual reset is also possible during the frozen time period.


          Maximum value: `3600` seconds (1 hour).

          '
      - name: mmp_group
        required: false
        in: query
        schema:
          type: string
          example: MassQuoteBot7
        description: 'Designates the MMP group for which the configuration is being set. If the specified group is already associated with a different `index_name`, an error is returned. This parameter enables distinct configurations for each MMP group, linked to particular `index_name`. Maximum 64 characters. Case sensitive. Cannot be empty string.


          **📖 Related Article:** [Mass Quotes Specifications](https://docs.deribit.com/articles/mass-quotes-specifications)

          '
      - name: quantity_limit
        required: false
        in: query
        schema:
          type: number
          example: 3
        description: 'The total traded quantity, measured in units of the base currency (e.g., BTC in `BTC-PERPETUAL`), within the `interval`.


          This count is direction-agnostic—a buy followed by a sell counts double.


          Example: Buy `10` BTC and sell `10` BTC = `20` total quantity.


          Applicable to both options and futures.


          Positive value with maximum 4 decimal places.

          '
      - name: delta_limit
        required: false
        in: query
        schema:
          type: number
        description: 'The maximum allowable net transaction delta change during the `interval`.


          Expressed in units of base currency.


          The `delta_limit` is treated as an absolute threshold: e.g., `delta_limit: 10` → MMP is triggered if net transaction delta exceeds `+10` or drops below `-10`.


          Direction matters: buying `+5` delta and selling `−5` delta cancels out if within the same `interval`.


          **Note:** Note that we use the net transaction delta instead of delta. Net Transaction Delta = `Delta - Mark Price`. In the rest of this document, "delta" actually refers to net transaction delta.


          Positive value with maximum 4 decimal places.

          '
      - name: vega_limit
        required: false
        in: query
        schema:
          type: number
        description: 'The maximum change in vega exposure allowed within a given `interval`, measured in absolute terms.


          Expressed in USD, representing the change in sensitivity to implied volatility across executed trades.


          This parameter is primarily relevant for options traders managing risk in volatile markets.


          Similar to `delta_limit`, the `vega_limit` is direction-aware and evaluated on a net basis. If the exposure exceeds the set threshold (positively or negatively), MMP will be triggered.


          **Notice:** When evaluating Delta and Vega limits for MMP, Deribit uses the greeks at the moment of trade execution. The system does not re-evaluate Delta or Vega using live greeks at the time of MMP checking.


          Positive value with maximum 4 decimal places.

          '
      - name: max_quote_quantity
        required: true
        in: query
        schema:
          type: number
          example: 2.5
        description: Maximum Quote Quantity (MQQ) in base currency. MQQ is configured per index but enforced per side, per order book (instrument) — the total combined size of open MMP orders per side per instrument cannot exceed MQQ. **See response description for detailed information about MQQ behavior and limitations.** Maximum 4 decimal places.
      - name: block_rfq
        required: false
        in: query
        schema:
          type: boolean
          default: false
        description: 'If true, configures MMP for Block RFQ. When set, requires `block_rfq` scope instead of `trade` scope. Block RFQ MMP settings are completely separate from normal order/quote MMP settings.

          '
      - name: trade_count_limit
        required: false
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: For Block RFQ only (`block_rfq` = `true`). Sets the maximum number of Block RFQ trades allowed in the lookback window. Each RFQ trade counts as `+1` towards the limit (not individual legs). Works across all currency pairs. When using this parameter, `index_name` must be set to `"all"`. Maximum - `1000`.
      responses:
        '200':
          $ref: '#/components/responses/PrivateSetMmpConfigResponse'
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 7859
                  method: private/set_mmp_config
                  params:
                    index_name: btc_usd
                    mmp_group: MassQuoteBot7
                    interval: 60
                    frozen_time: 0
                    quantity_limit: 3
                    max_quote_quantity: 2.5
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Configures Market Maker Protection (MMP) for a specific index. This method sets the monitoring window, freeze duration, and exposure limits (quantity, delta, vega, and Maximum Quote Quantity).


        At least one limit parameter must be set. Maximum Quote Quantity (MQQ) is a required parameter that limits the total combined size of open MMP orders. MQQ is configured per index but enforced per side, per order book (instrument).


        The `interval` parameter defines the monitoring window duration in seconds. The `frozen_time` parameter sets how long MMP remains active after being triggered. Set `frozen_time` to `0` to disable automatic reset (manual reset required).


        For Mass Quotes, use the `mmp_group` parameter to configure MMP for a specific group. Set `block_rfq` to `true` to configure MMP for Block RFQ (requires `block_rfq:read_write` scope). Set `interval` to `0` to remove MMP configuration.


        **📖 Related Article:** [Market Maker Protection API Configuration](https://docs.deribit.com/articles/market-maker-protection)


        **Scope:** `trade:read_write` or `block_rfq:read_write` (when `block_rfq` = `true`)


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Fset_mmp_config)


        '
      x-mint:
        metadata:
          title: private/set_mmp_config
          og:title: private/set_mmp_config
          keywords:
          - private/set_mmp_config
          - index_name
          - interval
          - frozen_time
          - mmp_group
          - quantity_limit
          - delta_limit
          - vega_limit
          - max_quote_quantity
          - block_rfq
          - trade_count_limit
        href: /api-reference/trading/private-set_mmp_config
  /private/reset_mmp:
    get:
      tags:
      - Trading
      parameters:
      - name: index_name
        required: true
        in: query
        schema:
          type: string
          example: btc_usd
        description: 'Currency pair for which to reset MMP limits.


          **For regular MMP (`block_rfq = false`):** Must be a specific currency pair (e.g., "btc_usd", "eth_usd"). The value `"all"` is not allowed.


          **For Block RFQ MMP (`block_rfq = true`):** Can be either a specific currency pair or `"all"` to reset MMP limits across all currency pairs.

          '
      - name: mmp_group
        required: false
        in: query
        schema:
          type: string
          example: MassQuoteBot7
        description: 'Specifies the MMP group for which limits are being reset. If this parameter is omitted, the method resets the traditional (no group) MMP limits.


          **📖 Related Article:** [Mass Quotes Specifications](https://docs.deribit.com/articles/mass-quotes-specifications)

          '
      - name: block_rfq
        required: false
        in: query
        schema:
          type: boolean
          default: false
        description: 'If true, resets MMP for Block RFQ. When set, requires `block_rfq` scope instead of `trade` scope. Block RFQ MMP settings are completely separate from normal order/quote MMP settings. When `block_rfq = true`, the `index_name` parameter can be set to `"all"` to reset limits across all currency pairs.

          '
      responses:
        '200':
          $ref: '#/components/responses/OkResponse'
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 7859
                  method: private/reset_mmp
                  params:
                    index_name: btc_usd
                    mmp_group: MassQuoteBot7
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Resets Market Maker Protection (MMP) limits for the specified currency pair or MMP group. If MMP protection has been triggered and quoting is frozen, this method allows you to manually resume quoting.


        If the configured `frozen_time` has expired, the system will automatically reset MMP. If `frozen_time` is set to `0` (automatic reset disabled), you must call this method to re-enable quoting. You can also perform a manual reset during the frozen period if you want to resume quoting early.


        For regular MMP (`block_rfq = false`), the `index_name` must be a specific currency pair (e.g., "btc_usd", "eth_usd"). For Block RFQ MMP (`block_rfq = true`), you can set `index_name` to `"all"` to reset limits across all currency pairs. Use the `mmp_group` parameter to reset limits for a specific MMP group.


        **📖 Related Article:** [Market Maker Protection API Configuration](https://docs.deribit.com/articles/market-maker-protection)


        **Scope:** `trade:read_write` or `block_rfq:read_write` (when `block_rfq` = `true`)


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Freset_mmp)


        '
      x-mint:
        metadata:
          title: private/reset_mmp
          og:title: private/reset_mmp
          keywords:
          - private/reset_mmp
          - index_name
          - mmp_group
          - block_rfq
        href: /api-reference/trading/private-reset_mmp
  /private/mass_quote:
    get:
      parameters:
      - name: wait_for_response
        in: query
        schema:
          type: boolean
        required: false
        description: If false, the response is sent immediately after the risk check. If true, the response is sent after the orders all go through the matching engine. Default - `true`.
      - name: detailed
        in: query
        schema:
          type: boolean
          example: true
        required: false
        description: Flag to receive a list of all order changes and a list of errors, or to only receive a list of errors. Default - `false`.
      - name: quote_id
        in: query
        schema:
          type: string
          example: '1'
        required: true
        description: Identifier of a mass quote message. Can be used to match trades to requests. We recommend using an incrementing counter.
      - name: mmp_group
        in: query
        schema:
          type: string
          example: default
        required: true
        description: Name of the MMP group. An MMP group has to be used and only one quote can exist per instrument per side per MMP group.
      - name: valid_until
        in: query
        schema:
          type: integer
        required: false
        description: Timestamp, when provided server will start processing request in Matching Engine only before given timestamp, in other cases `timed_out` error will be responded. Remember that the given timestamp should be consistent with the server's time, use <a href='#public-get_time'>/public/time</a> method to obtain current server time.
      - name: quotes
        in: query
        required: true
        schema:
          type: array
          items:
            type: object
            properties:
              instrument_name:
                type: string
                description: The name of the instrument.
              quote_set_id:
                type: string
                description: User-defined label that can be used for targeted cancels using private/cancel_quotes.
              ask:
                type: object
                properties:
                  price:
                    type: number
                    description: The price of this side of the quote. If no price is supplied, only the amount is amended.
                  amount:
                    type: number
                    description: The amount of this side of the quote. If no quantity is supplied, only the price is amended.
                  post_only:
                    type: boolean
                    default: false
                    description: If true, the order is considered post-only. If the new price would cause the order to be filled immediately (as taker), the price will be changed to be just below the spread. Default - `false`
                  reject_post_only:
                    type: boolean
                    default: false
                    description: If an order is considered post-only and this field is set to true then the order is put to the order book unmodified or the request is rejected. Only valid in combination with "post_only" set to `true`. Default value - `false`
                description: Order details for the ask. If not provided, `bid` must be present.
              bid:
                type: object
                properties:
                  price:
                    type: number
                    description: The price of this side of the quote. If no price is supplied, only the amount is amended.
                  amount:
                    type: number
                    description: The amount of this side of the quote. If no quantity is supplied, only the price is amended.
                  post_only:
                    type: boolean
                    default: false
                    description: If true, the order is considered post-only. If the new price would cause the order to be filled immediately (as taker), the price will be changed to be just below the spread. Default - `false`
                  reject_post_only:
                    type: boolean
                    default: false
                    description: If an order is considered post-only and this field is set to true then the order is put to the order book unmodified or the request is rejected. Only valid in combination with "post_only" set to `true`. Default value - `false`
                description: Order details for the bid. If not provided, `ask` must be present.
          example:
          - instrument_name: BTC-PERPETUAL
            quote_set_id: futures
            ask:
              price: 43800
              amount: 10
            bid:
              price: 43700
              amount: 10
          - instrument_name: BTC-22DEC23-41600-C
            quote_set_id: options
            ask:
              price: 0.05
              amount: 1
            bid:
              price: 0.04
              amount: 1
        description: List of quotes.
        style: form
        explode: true
      responses:
        '200':
          $ref: '#/components/responses/PrivateMassQuoteResponse'
      tags:
      - Trading
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 7859
                  method: private/mass_quote
                  params:
                    detailed: true
                    quote_id: '1'
                    mmp_group: default
                    quotes:
                    - instrument_name: BTC-PERPETUAL
                      quote_set_id: futures
                      ask:
                        price: 43800
                        amount: 10
                      bid:
                        price: 43700
                        amount: 10
                    - instrument_name: BTC-22DEC23-41600-C
                      quote_set_id: options
                      ask:
                        price: 0.05
                        amount: 1
                      bid:
                        price: 0.04
                        amount: 1
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Places buy and/or sell orders (quotes) on one or more instruments simultaneously. This method is designed for market makers who need to quote on multiple instruments efficiently.


        **Requirements:**

        - Cancel-on-Disconnect must be enabled (see [private/enable_cancel_on_disconnect](https://docs.deribit.com/api-reference/session-management/private-enable_cancel_on_disconnect)), otherwise the request will return an error.

        - This endpoint can only be used after approval from the administrators.


        Each quote can include both bid and ask sides, or just one side. Quotes are identified by `quote_set_id` for targeted cancellation. Use the `wait_for_response` parameter to control whether to wait for all orders to be processed before returning.


        **📖 Related Article:** [Mass Quotes Specifications](https://docs.deribit.com/articles/mass-quotes-specifications)


        **Scope:** `trade:read_write`


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Fmass_quote)


        '
      x-mint:
        metadata:
          title: private/mass_quote
          og:title: private/mass_quote
          keywords:
          - private/mass_quote
          - wait_for_response
          - detailed
          - quote_id
