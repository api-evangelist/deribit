    get:
      tags:
      - Trading
      parameters:
      - name: index_name
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/index_name_derivative'
        description: Index identifier of derivative instrument on the platform; skipping this parameter will return all configurations
      - name: mmp_group
        required: false
        in: query
        schema:
          type: string
          example: MassQuoteBot7
        description: 'Specifies the MMP group for which the status is being retrieved. The `index_name` must be specified before using this parameter.


          **📖 Related Article:** [Mass Quotes Specifications](https://docs.deribit.com/articles/mass-quotes-specifications)

          '
      - name: block_rfq
        required: false
        in: query
        schema:
          type: boolean
          default: false
        description: 'If true, retrieves MMP status for Block RFQ. When set, requires `block_rfq` scope instead of `trade` scope. Block RFQ MMP status is completely separate from normal order/quote MMP status.

          '
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetMmpStatusResponse'
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 7851
                  method: private/get_mmp_status
                  params:
                    index_name: btc_usd
                    mmp_group: MassQuoteBot7
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Retrieves Market Maker Protection (MMP) status for a triggered index or MMP group. Returns the live MMP state including whether MMP is enabled or triggered, remaining frozen time (if triggered), whether quoting is currently allowed, and any active freeze conditions.


        If the `index_name` parameter is not provided, a list of all triggered MMP statuses is returned. This method lets you track whether protection is active and when quoting will resume.


        For Mass Quotes, specify the `mmp_group` parameter to check status for a specific MMP group. Set `block_rfq` to `true` to retrieve MMP status for Block RFQ (requires `block_rfq:read` scope).


        **📖 Related Article:** [Market Maker Protection API Configuration](https://docs.deribit.com/articles/market-maker-protection)


        **Scope:** `trade:read` or `block_rfq:read` (when `block_rfq` = `true`)


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Fget_mmp_status)


        '
      x-mint:
        metadata:
          title: private/get_mmp_status
          og:title: private/get_mmp_status
          keywords:
          - private/get_mmp_status
          - index_name
          - mmp_group
