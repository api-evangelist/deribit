  /private/get_mmp_config:
    get:
      tags:
      - Trading
      parameters:
      - name: index_name
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/index_name_derivative'
        description: Index identifier of derivative instrument on the platform; skipping this parameter will return all configurations
      - name: mmp_group
        required: false
        in: query
        schema:
          type: string
          example: MassQuoteBot7
        description: 'Specifies the MMP group for which the configuration is being retrieved. MMP groups are used for Mass Quotes. If MMP group is not provided, the method returns the configuration for the MMP settings for regular orders. The `index_name` must be specified before using this parameter.


          **Note:** Leaving `mmp_group` empty is explicitly allowed and is the correct way to retrieve configuration for the orders MMP group. It is not an error or an incomplete request — omitting this field intentionally targets the default orders MMP group rather than any named mass quote group.


          **📖 Related Article:** [Mass Quotes Specifications](https://docs.deribit.com/articles/mass-quotes-specifications)

          '
      - name: block_rfq
        required: false
        in: query
        schema:
          type: boolean
          default: false
        description: 'If true, retrieves MMP configuration for Block RFQ. When set, requires `block_rfq` scope instead of `trade` scope. Block RFQ MMP settings are completely separate from normal order/quote MMP settings.

          '
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetMmpConfigResponse'
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 7859
                  method: private/get_mmp_config
                  params:
                    index_name: btc_usd
                    mmp_group: MassQuoteBot7
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Retrieves Market Maker Protection (MMP) configuration for an index. Returns all currently active MMP parameters for the selected index, including the interval, `frozen_time`, quantity/delta/vega limits, and `max_quote_quantity`.


        If the `index_name` parameter is not provided, a list of all MMP configurations is returned. An empty list means no MMP configuration exists. This method is useful for verifying your configuration or confirming applied updates.


        For Mass Quotes, specify the `mmp_group` parameter to retrieve configuration for a specific MMP group. If no group is provided, returns configuration for regular orders. Set `block_rfq` to `true` to retrieve MMP configuration for Block RFQ (requires `block_rfq:read` scope).


        Each entry in the response includes an `id` field (integer) that uniquely identifies the MMP group. This integer ID is the programmatic identifier for the group and can be used to reference it in contexts where the string `mmp_group` name is not accepted. Entries that have no `mmp_group` name in the response correspond to the orders MMP group (the default group).


        **📖 Related Article:** [Market Maker Protection API Configuration](https://docs.deribit.com/articles/market-maker-protection)


        **Scope:** `trade:read` or `block_rfq:read` (when `block_rfq` = `true`)


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Fget_mmp_config)


        '
      x-mint:
        metadata:
          title: private/get_mmp_config
          og:title: private/get_mmp_config
          keywords:
          - private/get_mmp_config
          - index_name
          - mmp_group
          - block_rfq
          - interval
          - frozen_time
          - quantity_limit
          - delta_limit
          - vega_limit
          - max_quote_quantity
          - trade_count_limit
        href: /api-reference/trading/private-get_mmp_config
