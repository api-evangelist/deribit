  /private/get_user_trades_by_instrument:
    get:
      parameters:
      - name: instrument_name
        required: true
        in: query
        schema:
          $ref: '#/components/schemas/instrument_name'
        description: Instrument name
      - name: start_seq
        required: false
        in: query
        schema:
          type: integer
        description: The sequence number of the first trade to be returned
      - name: end_seq
        required: false
        in: query
        schema:
          type: integer
        description: The sequence number of the last trade to be returned
      - name: count
        required: false
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: Number of requested items, default - `10`, maximum - `1000`
      - name: start_timestamp
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/timestamp'
        description: The earliest timestamp to return result from (milliseconds since the UNIX epoch). When param is provided trades are returned from the earliest
      - name: end_timestamp
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/timestamp'
        description: 'The most recent timestamp to return result from (milliseconds since the UNIX epoch). Only one of params: start_timestamp, end_timestamp is truly required'
      - name: historical
        in: query
        required: false
        schema:
          type: boolean
        description: 'Determines whether historical trade and order records should be retrieved.


          - `false` (default): Returns recent records: orders for 30 min, trades for 24h.

          - `true`: Fetches historical records, available after a short delay due to indexing. Recent data is not included.


          **📖 Related Article:** [Accessing Historical Trades and Orders Using API](https://docs.deribit.com/articles/accessing-historical-trades-orders)

          '
      - name: sorting
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/sorting'
        description: Direction of results sorting (`default` value means no sorting, results will be returned in order in which they left the database)
      - name: subaccount_id
        in: query
        required: false
        schema:
          type: integer
          example: 9
        description: Id of a subaccount
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetUserTradesHistoryResponse'
      tags:
      - Trading
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  jsonrpc: '2.0'
                  id: 5728
                  method: private/get_user_trades_by_instrument
                  params:
                    instrument_name: ETH-PERPETUAL
                    start_seq: 1966042
                    count: 2
                description: JSON-RPC Request Example
        description: JSON-RPC request body
      description: 'Retrieves the latest user trades that have occurred for a specific instrument. Returns trade details including price, amount, direction, timestamp, trade ID, and order ID.


        Results can be filtered by sequence number range or timestamp range. Use the `count` parameter to limit the number of trades returned, and `sorting` to control the order (ascending or descending by trade ID). Use `historical` to retrieve historical trade data.


        Main accounts may use the `subaccount_id` parameter to retrieve trade data for a specific subaccount (requires `mainaccount` scope).


        **📖 Related Article:** [Accessing Historical Trades and Orders Using API](https://docs.deribit.com/articles/accessing-historical-trades-orders)


        **Scope:** `trade:read`


        [Try in API console](https://test.deribit.com/api_console?method=%2Fprivate%2Fget_user_trades_by_instrument)


