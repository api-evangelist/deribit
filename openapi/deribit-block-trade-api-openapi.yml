        broker_code:
          type: string
          example: 2krM7sJsx
          description: Broker code associated with the broker block trade.
        broker_name:
          type: string
          example: Test Broker
          description: Name of the broker associated with the block trade.
      required:
      - id
      - timestamp
      - trades
      type: object
    nonce:
      example: bF1_gfgcsd
      type: string
      description: Nonce
    PrivateGetBrokerTradeRequestsResponse:
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
          description: The JSON-RPC version (2.0)
        id:
          type: integer
          description: The id that was sent in the request
        result:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: integer
                description: Timestamp of the broker block trade request (milliseconds since the UNIX epoch).
              state:
                type: string
                description: State of the broker block trade request.
              trades:
                type: array
