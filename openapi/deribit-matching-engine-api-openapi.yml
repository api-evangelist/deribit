  /private/move_positions:
    get:
      parameters:
      - in: query
        name: currency
        required: false
        schema:
          $ref: '#/components/schemas/currency'
        description: The currency symbol
      - name: source_uid
        in: query
        schema:
          type: integer
          example: 1
        required: true
        description: Id of source subaccount. Can be found in `My Account >> Subaccounts` tab
      - name: target_uid
        in: query
        schema:
          type: integer
          example: 1
        required: true
        description: Id of target subaccount. Can be found in `My Account >> Subaccounts` tab
      - in: query
        name: trades
        required: true
        schema:
          type: array
          items:
            type: object
            properties:
              instrument_name:
                $ref: '#/components/schemas/instrument_name'
                description: Instrument name
              price:
                type: number
                description: Price for trade - if not provided average price of the position is used
              amount:
                type: number
