      description: Direction of the "tick" (`0` = Plus Tick, `1` = Zero-Plus Tick, `2` = Minus Tick, `3` = Zero-Minus Tick).
    profit_loss:
      type: number
      description: Profit and loss in base currency.
    currency:
      enum:
      - BTC
