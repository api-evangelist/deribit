          - best_bid_price
          - best_bid_amount
          - best_ask_price
          - best_ask_amount
          - index_price
          - min_price
          - max_price
          - mark_price
          - last_price
          - underlying_price
          - underlying_index
          - interest_rate
          - bid_iv
          - ask_iv
          - mark_iv
          - greeks
          - funding_8h
          - current_funding
          - delivery_price
          - settlement_price
          - bids
          - asks
          - volume
          - low
          - high
          - price_change
          - volume_usd
          - delta
          - gamma
          - rho
          - theta
