  /api/v2/public/get_instruments:
    get:
      operationId: get_instruments
      summary: List Instruments
      description: 'Returns the list of tradeable instruments, optionally filtered by base currency, instrument kind, and expiration status. This endpoint is public — no authentication is required.


        Filter semantics:

        - `currency` filters by the **base** currency of the instrument''s currency pair (case-insensitive match).

        - `kind` filters by instrument type (case-insensitive match against the `kind` value enum).

        - `expired = true` returns only instruments whose `expiration_timestamp` is in the past; `expired = false` returns only non-expired instruments. Omit the parameter to get both.'
      tags:
      - Market Data
      security: []
      parameters:
      - name: currency
        in: query
        required: false
        description: Filter by the base currency of the instrument's currency pair (e.g. `BTC`, `ETH`, `AVAX`). Case-insensitive.
        schema:
          type: string
        example: BTC
      - name: kind
        in: query
        required: false
        description: Filter by instrument kind. Case-insensitive.
        schema:
          type: string
          enum:
          - perp_future
          - option
          - spot
          - future_combo
          - option_combo
          - dated_future
        example: perp_future
      - name: expired
        in: query
        required: false
        description: When `true`, return only expired instruments. When `false`, return only currently-active (non-expired) instruments. Omit to return both.
        schema:
          type: boolean
        example: false
      responses:
        '200':
          description: List of instruments matching the supplied filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInstrumentsResponse'
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                - instrument_id: 124942
                  instrument_name: ETH-PERPETUAL
                  kind: perp_future
                  product_group: ETH
                  base_currency: ETH
                  quote_currency: USDC
                  settlement_currency: USDC
                  tick_size: 0.01
                  is_active: true
                  creation_timestamp: 1747500000000
                - instrument_id: 200001
                  instrument_name: BTC-30MAY26-70000-C
                  kind: option
                  product_group: BTC
                  base_currency: BTC
                  quote_currency: USDC
                  settlement_currency: USDC
                  tick_size: 0.5
                  strike: 70000
                  option_type: call
                  is_active: true
                  expiration_timestamp: 1779148800000
                  creation_timestamp: 1748400000000
        '500':
          description: Internal server error while building the instrument list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
