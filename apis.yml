- aid: deribit:deribit-private-api
  name: Deribit Private API
  description: >-
    <p>Private methods require authentication. All requests must include a valid OAuth2 token.</p>

    <p>A token can be requested using the <a href="#public-auth">/public/auth</a> method.</p>

    <p>When using the websockets protocol, the token must be included as a parameter <code>access_token</code>
    in the message. When using REST (HTTP GET), the token may also be passed in the <code>Authorization</code>
    header.</p>
